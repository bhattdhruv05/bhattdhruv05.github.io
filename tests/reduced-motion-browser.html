<!doctype html><html lang="en"><meta charset="utf-8"><title>Reduced-motion recovery check</title>
<style>body{font:14px system-ui;margin:20px}iframe{width:100%;height:850px}pre{white-space:pre-wrap}button{padding:10px}pre#results{position:fixed;top:5px;right:5px;width:310px;max-height:260px;overflow:auto;background:#fff;z-index:10;border:1px solid #aaa;padding:8px;font-size:11px}</style>
<button id="run" disabled>Test reduced-motion recovery</button><pre id="results" role="status">Preparing simulated reduced-motion page</pre><iframe id="site" title="Reduced-motion portfolio" allow="autoplay"></iframe>
<script>
const frame=document.querySelector('#site'),output=document.querySelector('#results');
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const pixels=c=>{const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data;let h=0;for(let i=0;i<d.length;i+=16)h=(h*31+d[i])>>>0;return h;};
(async()=>{
 const html=await(await fetch('../')).text();
 const base=new URL('../',location.href).href;
 const mock="<script>const originalMatchMedia=window.matchMedia.bind(window);window.matchMedia=query=>query.includes('prefers-reduced-motion')?{matches:true,media:query,addEventListener(){},removeEventListener(){}}:originalMatchMedia(query);try{localStorage.setItem('portfolio-motion','off')}catch(_){}<"+"/script>";
 frame.addEventListener('load',()=>{document.querySelector('#run').disabled=false;output.textContent='Ready';});
 frame.srcdoc=html.replace('<head>','<head><base href="'+base+'">'+mock);
})();
document.querySelector('#run').onclick=async()=>{
 const doc=frame.contentDocument,win=frame.contentWindow,results=[];
 const check=(name,pass)=>{results.push({name,pass:!!pass});output.textContent=JSON.stringify(results,null,2);};
 doc.querySelector('#explorer').scrollIntoView();await wait(200);
 check('Autoplay ignores the obsolete saved Pause setting and has no header control',win.portfolioMotion.enabled&&!doc.querySelector('[data-motion-toggle]'));
 const ring=doc.querySelector('#map-globe [data-ring-axis]');
 const pose=ring.getAttribute('ry');
 await wait(650);
 check('The map rotates by default with system reduced motion enabled',pose!==ring.getAttribute('ry'));
 doc.querySelector('[data-field="electronics"]').click();await wait(300);
 const canvas=doc.querySelector('#project-space canvas');const image=pixels(canvas);await wait(600);
 check('Selected preview actually moves with system reduced-motion',canvas.width>0&&pixels(canvas)!==image);
 win.portfolioMotion.setEnabled(!win.portfolioMotion.enabled);await wait(100);const frozen=pixels(canvas);await wait(400);
 check('Page suspension freezes the preview',!win.portfolioMotion.running&&pixels(canvas)===frozen);
 win.portfolioMotion.setEnabled(!win.portfolioMotion.enabled);await wait(700);
 check('Page resume resumes the preview',win.portfolioMotion.running&&pixels(canvas)!==frozen);
 doc.querySelector('[data-field="coding"]').click();await wait(300);
 const bend=doc.querySelector('.fem-canvas');
 const bending=pixels(bend);
 await wait(500);
 check('The 3D bend advances after resuming',pixels(bend)!==bending);
 win.portfolioMotion.setEnabled(false);await wait(100);
 const held=pixels(bend);
 await wait(400);
 check('Page suspension freezes the 3D bend',pixels(bend)===held);
 output.textContent=results.filter(r=>r.pass).length+'/'+results.length+' passed\n'+JSON.stringify(results,null,2);
};
</script></html>
